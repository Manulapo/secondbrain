services:
  app:
    build:
      context: .
      target: runner
      args:
        DATABASE_URL: ${DATABASE_URL}
        BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
        BETTER_AUTH_URL: ${BETTER_AUTH_URL}

    image: secondbrain:latest
    container_name: secondbrain
    restart: unless-stopped
    network_mode: host

    env_file:
      - /etc/secondbrain/secondbrain.env

    environment:
      PORT: "3001"
      HOSTNAME: "127.0.0.1"

    init: true

    security_opt:
      - no-new-privileges:true

  migrate:
    profiles:
      - tools

    build:
      context: .
      target: tooling

    network_mode: host

    env_file:
      - /etc/secondbrain/secondbrain.env

    command:
      - npx
      - prisma
      - db
      - migrate
